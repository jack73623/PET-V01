    <style>
        :root {
            --duo-green: #58cc02;
            --duo-green-dark: #46a302;

            --duo-blue-dark: #1899d6;
            --duo-purple: #af66ff;
            --duo-purple-dark: #903cee;
            --duo-yellow: #ffc800;
            --duo-yellow-dark: #e5a400;
            --duo-red: #ff4b4b;
            --duo-red-dark: #d33131;
            --duo-gray: #e5e5e5;
            --duo-gray-dark: #cfcfcf;
        }

        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .font-fredoka {
            font-family: 'Fredoka', cursive, sans-serif;
        }

        /* Duolingo 3D Button Utility */
        .btn-duo {
            position: relative;
            transition: all 0.08s ease-in-out;
            border-bottom-style: solid;
        }
        .btn-duo:active:not(:disabled) {
            transform: translateY(4px);
            border-bottom-width: 0px !important;
            margin-bottom: 4px;
        }
        .btn-duo:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-green {
            background-color: var(--duo-green);
            border-bottom-width: 4px;
            border-bottom-color: var(--duo-green-dark);
            color: #ffffff;
        }
        .btn-blue {
            background-color: var(--duo-blue);
            border-bottom-width: 4px;
            border-bottom-color: var(--duo-blue-dark);
            color: #ffffff;
        }
        .btn-purple {
            background-color: var(--duo-purple);
            border-bottom-width: 4px;
            border-bottom-color: var(--duo-purple-dark);
            color: #ffffff;
        }
        .btn-white {
            background-color: #ffffff;
            border: 2px solid var(--duo-gray);
            border-bottom-width: 4px;
            border-bottom-color: var(--duo-gray-dark);
            color: #4b4b4b;
        }
        .btn-white.selected {
            background-color: #ddf4ff;
            border-color: #84d8ff;
            border-bottom-color: var(--duo-blue);
            color: var(--duo-blue-dark);
        }

        /* Sentence Reordering Chips */
        .word-bubble {
            background-color: white;
            border: 2px solid var(--duo-gray);
            border-bottom-width: 4px;
            border-bottom-color: var(--duo-gray-dark);
            border-radius: 1rem;
            padding: 0.55rem 1rem;
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.12s ease;
        }
        .word-bubble:hover {
            background-color: #f7f7f7;
        }
        .word-bubble:active {
            transform: translateY(3px);
            border-bottom-width: 1px;
        }

        /* Letter slots for Listen & Spell */
        .letter-slot {
            width: 2.35rem;
            height: 3.1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 0.75rem;
            border: 2px solid var(--duo-gray);
            border-bottom-width: 4px;
            border-bottom-color: var(--duo-gray-dark);
            background-color: #ffffff;
            color: #2b2b2b;
            transition: all 0.15s ease;
        }
        .letter-slot.filled {
            border-color: #84d8ff;
            border-bottom-color: var(--duo-blue);
            background-color: #eaf7ff;
            color: var(--duo-blue-dark);
        }
        .letter-slot.active-cursor {
            border-color: var(--duo-blue);
            border-bottom-color: var(--duo-blue-dark);
            box-shadow: 0 0 0 3px rgba(28, 176, 246, 0.25);
            animation: pulse-border 1.2s infinite ease-in-out;
        }
        @keyframes pulse-border {
            0%, 100% { border-color: var(--duo-blue); }
            50% { border-color: #9fe2ff; }
        }

        /* Microphone Pulse Animation */
        @keyframes duo-pulse {
            0% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(28, 176, 246, 0.7); }
            70% { transform: scale(1.06); box-shadow: 0 0 0 16px rgba(28, 176, 246, 0); }
            100% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(28, 176, 246, 0); }
        }
        .mic-active {
            animation: duo-pulse 1.4s infinite cubic-bezier(0.4, 0, 0.6, 1);
            background-color: #1cb0f6 !important;
            border-color: #1899d6 !important;
            color: white !important;
        }

        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .mascot-bounce {
            animation: gentle-bounce 2.6s infinite ease-in-out;
        }
    </style>

    <script>
        /* Web Audio Sound Synthesizer */
        class DuoSoundEngine {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
            }
            playTone(freq, type = 'sine', duration = 0.15, delay = 0, gainVal = 0.15) {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + delay);
                    osc.stop(this.ctx.currentTime + delay + duration);
                } catch(e) {
                    console.warn(e);
                }
            }
            correct() {
                // Duolingo celebratory dual chime (C6 -> G6)
                this.playTone(1046.5, 'triangle', 0.14, 0, 0.18);
                this.playTone(1567.98, 'triangle', 0.38, 0.11, 0.22);
            }
            wrong() {
                // Low buzz error sound
                this.playTone(260, 'sawtooth', 0.16, 0, 0.2);
                this.playTone(220, 'sawtooth', 0.28, 0.12, 0.22);
            }
            pop() {
                this.playTone(650, 'sine', 0.05, 0, 0.08);
            }
            cheer() {
                [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
                    this.playTone(f, 'sine', 0.35, i * 0.09, 0.2);
                });
            }
        }

        let currentStage = 'learn'; // 'learn' | 'transition' | 'practice' | 'summary'
        let learnWordIndex = 0; // 0 to 9

        function speak(text, rate = 0.9) {
            sfx.init();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'en-US';
                u.rate = rate;
                const voices = window.speechSynthesis.getVoices();
                const englishVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Samantha')));
                if (englishVoice) u.voice = englishVoice;
                window.speechSynthesis.speak(u);
            }
        }

        // Web Speech Recognition Helper
        function startSpeechRecognition(onResult, onEnd) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) return null;
            const rec = new SpeechRec();
            rec.lang = 'en-US';
            rec.interimResults = false;
            rec.maxAlternatives = 3;
            rec.onresult = (e) => {
                const transcript = e.results[0][0].transcript;
                onResult(transcript);
            };
            rec.onerror = (err) => {
                console.warn('Speech Rec error:', err);
                onEnd();
            };
            rec.onend = () => {
                onEnd();
            };
            return rec;
        }

        function highlightWordInSentence(sentence, targetWord) {
            const regex = new RegExp(`(${targetWord}[a-z]*)`, 'gi');
            return sentence.replace(regex, `<span class="text-blue-600 font-black underline decoration-blue-300 decoration-2 underline-offset-2">$1</span>`);
        }

                    } else {
                        slot.classList.remove('filled');
                        if (i === val.length) {
                            slot.classList.add('active-cursor');
                        } else {
                            slot.classList.remove('active-cursor');
                        }
                    }
                });
            }

            inputField.focus();
            inputField.oninput = (e) => {
                const cleaned = e.target.value.replace(/[^a-zA-Z]/g, '').slice(0, wordLength);
                e.target.value = cleaned;
                currentSpellingInput = cleaned.trim();
                updateSlots(currentSpellingInput);
                document.getElementById('main-action-btn').disabled = currentSpellingInput.length !== wordLength;
            };

            setTimeout(() => speak(challenge.target, 0.9), 300);
        }

        /* 2. 單字填空 (Fill-in) */
        function renderFillInExercise(container, challenge, vocab) {
            const parts = challenge.question.split("________");
            const shuffled = [...challenge.options].sort(() => Math.random() - 0.5);

            container.innerHTML = `
                <div class="max-w-xl mx-auto flex flex-col gap-6">
                    <div>
                        <h3 class="text-2xl sm:text-3xl font-extrabold text-gray-900 font-fredoka">單字填空 (Fill-in)</h3>
                        <p class="text-sm font-bold text-gray-500 mt-1">選出最符合文意與詞性的 PET 單字</p>
                    </div>

                    <div class="bg-white border-2 border-gray-200 rounded-3xl p-6 shadow-sm flex flex-col gap-3">
                        <div class="flex items-center gap-2 text-lg sm:text-xl font-black text-gray-800 flex-wrap leading-relaxed">
                            <span>${parts[0]}</span>
                            <span id="fill-in-blank" class="min-w-[120px] px-3 py-1 border-b-4 border-blue-400 bg-blue-50/60 text-blue-600 font-black rounded-lg text-center">
                                ?
                            </span>
                            <span>${parts[1] || ''}</span>
                        </div>
                        <p class="text-sm font-bold text-gray-400 mt-1">${challenge.translationZh}</p>
                    </div>

                    <!-- Multiple Choices (4 options) -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        ${shuffled.map(opt => `
                            <button class="fill-option-btn btn-duo btn-white rounded-2xl py-4 px-4 text-center font-extrabold text-lg text-gray-800 tracking-wide" data-val="${opt}">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;

            const optionBtns = container.querySelectorAll('.fill-option-btn');
            const blankSpan = document.getElementById('fill-in-blank');

            optionBtns.forEach(btn => {
                btn.onclick = () => {
                    sfx.pop();
                    optionBtns.forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    currentFillSelected = btn.getAttribute('data-val');
                    blankSpan.innerText = currentFillSelected;
                    blankSpan.classList.add('bg-blue-100');
                    document.getElementById('main-action-btn').disabled = false;
                };
            });
        }

        /* 3. 單字卡重組句子 (Sentence Reordering) */
        function renderSentenceReorderExercise(container, challenge, vocab) {
            let availableChips = [...challenge.chips].sort(() => Math.random() - 0.5);

            container.innerHTML = `
                <div class="max-w-xl mx-auto flex flex-col gap-6">
                    <div>
                        <h3 class="text-2xl sm:text-3xl font-extrabold text-gray-900 font-fredoka">重組句子 (Sentence Reordering)</h3>
                        <p class="text-sm font-bold text-gray-500 mt-1">點擊下方字卡，拼出正確的英語語序：</p>
                    </div>

                    <div class="text-base font-bold text-gray-700 bg-blue-50/80 border border-blue-100 px-4 py-3 rounded-2xl flex items-center justify-between">
                        <span>中文句意：${challenge.translationZh}</span>
                        <button onclick="speak('${challenge.target.replace(/'/g, "\\'")}', 0.85)" class="text-blue-500 hover:text-blue-600 p-1" title="聽句子">
                            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                        </button>
                    </div>

                    <!-- Selected Target Area -->
                    <div id="reorder-target-box" class="min-h-[80px] bg-white border-2 border-dashed border-gray-300 rounded-3xl p-3 flex flex-wrap items-center gap-2 transition-all">
                        <span id="reorder-placeholder" class="text-sm font-bold text-gray-400 pl-3">點選下方單字卡放入此處...</span>
                    </div>

                    <!-- Available Word Chips Bank -->
                    <div id="reorder-bank" class="flex flex-wrap justify-center gap-2.5 p-2 min-h-[90px]"></div>
                </div>
            `;

            const targetBox = document.getElementById('reorder-target-box');
            const bankBox = document.getElementById('reorder-bank');
            const placeholder = document.getElementById('reorder-placeholder');

            function syncChips() {
                targetBox.innerHTML = '';
                bankBox.innerHTML = '';

                if (currentReorderBuilt.length === 0) {
                    targetBox.appendChild(placeholder);
                } else {
                    currentReorderBuilt.forEach((word, idx) => {
                        const chip = document.createElement('button');
                        chip.className = 'word-bubble bg-blue-50 text-blue-700 border-blue-200';
                        chip.innerText = word;
                        chip.onclick = () => {
                            sfx.pop();
                            currentReorderBuilt.splice(idx, 1);
                            availableChips.push(word);
                            syncChips();
                        };
                        targetBox.appendChild(chip);
                    });
                }

                availableChips.forEach((word, idx) => {
                    const chip = document.createElement('button');
                    chip.className = 'word-bubble text-gray-800';
                    chip.innerText = word;
                    chip.onclick = () => {
                        sfx.pop();
                        availableChips.splice(idx, 1);
                        currentReorderBuilt.push(word);
                        syncChips();
                    };
                    bankBox.appendChild(chip);
                });

                document.getElementById('main-action-btn').disabled = currentReorderBuilt.length === 0;
            }

            syncChips();
        }

        /* 4. 口說指定片語 (Speak Out) */
        function renderSpeakOutExercise(container, challenge, vocab) {
            container.innerHTML = `
                <div class="max-w-xl mx-auto flex flex-col items-center gap-6 text-center">
                    <div>
                        <h3 class="text-2xl sm:text-3xl font-extrabold text-gray-900 font-fredoka">口說朗讀挑戰 (Speak Out)</h3>
                        <p class="text-sm font-bold text-gray-500 mt-1">聽聽示範，然後按下麥克風大聲讀出下方文字：</p>
                    </div>

                    <div class="w-full bg-white border-2 border-gray-200 rounded-3xl p-6 shadow-sm flex flex-col items-center gap-4">
                        <button onclick="speak('${challenge.target.replace(/'/g, "\\'")}', 0.85)" class="flex items-center gap-2 text-blue-500 font-bold hover:text-blue-600 bg-blue-50 px-4 py-2 rounded-xl border border-blue-100">
                            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                            <span>聆聽示範發音</span>
                        </button>

                        <div class="text-2xl sm:text-3xl font-black text-gray-800 tracking-wide font-fredoka py-1">
                            "${challenge.target}"
                        </div>
                        <p class="text-sm font-semibold text-gray-400">中文：${challenge.translationZh}</p>

                        <div class="pt-3 flex flex-col items-center gap-3">
                            <button id="challenge-mic-btn" class="btn-duo btn-white rounded-full p-6 border-2 border-gray-200 text-gray-700 hover:text-blue-500 shadow-md">
                                <svg class="w-10 h-10 fill-current" viewBox="0 0 24 24">
                                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
                                </svg>
                            </button>
                            <span id="challenge-mic-status" class="text-sm font-bold text-gray-500">點擊麥克風開始朗讀</span>
                        </div>
                    </div>
                </div>
            `;

            const micBtn = document.getElementById('challenge-mic-btn');
            const micStatus = document.getElementById('challenge-mic-status');

            micBtn.onclick = () => {
                if (isRecording) {
                    if (activeRecognition) activeRecognition.stop();
                    return;
                }

                sfx.init();
                micStatus.innerText = "聆聽中... 請清晰朗讀上方文字！";
                micStatus.className = "text-sm font-bold text-blue-500 animate-pulse";
                micBtn.classList.add('mic-active');
                isRecording = true;

                activeRecognition = startSpeechRecognition(
                    (spoken) => {
                        isRecording = false;
                        micBtn.classList.remove('mic-active');
                        currentSpokenTranscript = spoken;
                        micStatus.innerText = `辨識到: "${spoken}"`;
                        micStatus.className = "text-sm font-bold text-gray-700";
                        document.getElementById('main-action-btn').disabled = false;
                    },
                    () => {
                        isRecording = false;
                        micBtn.classList.remove('mic-active');
                    }
                );

                if (!activeRecognition) {
                    setTimeout(() => {
                        micBtn.classList.remove('mic-active');
                        isRecording = false;
                        currentSpokenTranscript = challenge.target;
                        micStatus.innerText = `模擬辨識完成: "${challenge.target}"`;
                        micStatus.className = "text-sm font-bold text-green-600";
                        document.getElementById('main-action-btn').disabled = false;
                    }, 1400);
                } else {
                    try {
                        activeRecognition.start();
                    } catch(e) {
                        isRecording = false;
                        micBtn.classList.remove('mic-active');
                    }
                }
            };
        }
    </script>

    <script>
        /* Check Answer Logic for Practice Mode */
        function checkCurrentPractice() {
            const challenge = CHALLENGES_DATA[challengeIndex];
            const currentVocab = VOCAB_DATA.find(v => v.id === challenge.vocabId);
            let isCorrect = false;
            let explanation = "";

            if (challenge.type === 'spelling') {
                isCorrect = currentSpellingInput.toLowerCase() === challenge.target.toLowerCase();
                explanation = `正確拼字為：${challenge.target}（${currentVocab.def}）`;
            } else if (challenge.type === 'fill') {
                isCorrect = currentFillSelected === challenge.target;
                explanation = `正確答案為：${challenge.target}（${challenge.translationZh}）`;
            } else if (challenge.type === 'reorder') {
                const builtStr = currentReorderBuilt.join(' ').replace(/[.?]/g, '').toLowerCase().trim();
                const expectedStr = challenge.target.replace(/[.?]/g, '').toLowerCase().trim();
                isCorrect = (builtStr === expectedStr);
                explanation = `正確語序：${challenge.target}`;
            } else if (challenge.type === 'speak') {
                const keyword = challenge.matchKeyword.toLowerCase();
                const spoken = (currentSpokenTranscript || '').toLowerCase();
                isCorrect = spoken.includes(keyword);
                explanation = `標準發音為：${challenge.target}`;
            }

            hasChecked = true;
            showAnswerFeedback(isCorrect, explanation);
        }

        function showAnswerFeedback(isCorrect, explanation) {
            const footer = document.getElementById('footer-section');
            const banner = document.getElementById('feedback-banner');
            const icon = document.getElementById('feedback-icon');
            const title = document.getElementById('feedback-title');
            const desc = document.getElementById('feedback-desc');
            const actionBtn = document.getElementById('main-action-btn');
            const viewCardBtn = document.getElementById('view-card-btn');

            banner.classList.remove('hidden');
            viewCardBtn.classList.add('hidden');
            actionBtn.innerText = "下一題 (Next)";

            if (isCorrect) {
                sfx.correct();
                addXP(20);
                footer.className = "w-full bg-[#d7ffb8] border-t-2 border-[#b8f28b] p-4 sticky bottom-0 z-20 transition-colors";
                icon.className = "w-12 h-12 rounded-full flex items-center justify-center font-black text-2xl text-white bg-[#58cc02]";
                icon.innerText = "✓";
                title.innerText = "太棒了！答對了";
                title.className = "font-fredoka text-xl font-bold text-[#46a302]";
                desc.innerText = explanation;
                desc.className = "text-sm font-semibold text-[#46a302]";
                actionBtn.className = "btn-duo btn-green rounded-2xl font-black text-base tracking-wider uppercase py-3.5 px-8 w-full";
            } else {
                sfx.wrong();
                deductHeart();
                footer.className = "w-full bg-[#ffdfe0] border-t-2 border-[#ffc1c1] p-4 sticky bottom-0 z-20 transition-colors";
                icon.className = "w-12 h-12 rounded-full flex items-center justify-center font-black text-2xl text-white bg-[#ff4b4b]";
                icon.innerText = "✕";
                title.innerText = "答案不太正確喔！";
                title.className = "font-fredoka text-xl font-bold text-[#d33131]";
                desc.innerText = explanation;
                desc.className = "text-sm font-semibold text-[#d33131]";
                actionBtn.className = "btn-duo rounded-2xl font-black text-base tracking-wider uppercase py-3.5 px-8 w-full bg-[#ff4b4b] border-b-4 border-[#d33131] text-white";
            }
        }

        function resetFooter() {
            const footer = document.getElementById('footer-section');
            const banner = document.getElementById('feedback-banner');
            const actionBtn = document.getElementById('main-action-btn');

            footer.className = "w-full bg-white border-t-2 border-gray-200 p-4 sticky bottom-0 z-20 transition-colors";
            banner.classList.add('hidden');
            actionBtn.className = "btn-duo btn-green rounded-2xl font-black text-base tracking-wider uppercase py-3.5 px-8 w-full";
        }

        function addXP(amount) {
            xp += amount;
            document.getElementById('xp-count').innerText = `${xp} XP`;
        }

        function deductHeart() {
            hearts = Math.max(0, hearts - 1);
            document.getElementById('hearts-count').innerText = hearts;
            if (hearts <= 0) {
                document.getElementById('energy-modal').classList.remove('hidden');
            }
        }

        /* Open/Close Stage 1 Learning Card Modal */
        function openVocabModal() {
            sfx.pop();
            const challenge = CHALLENGES_DATA[challengeIndex];
            const item = VOCAB_DATA.find(v => v.id === challenge.vocabId);
            const content = document.getElementById('modal-card-content');

            content.innerHTML = `
                <div class="flex items-center gap-2">
                    <span class="bg-purple-100 text-purple-700 text-xs font-black px-2.5 py-1 rounded-lg uppercase">${item.pos}</span>
                    <span class="text-gray-400 font-mono text-base">${item.ipa}</span>
                </div>
                <h3 class="text-3xl font-extrabold text-gray-900 font-fredoka">${item.word}</h3>
                <div class="text-xl font-black text-gray-700">${item.def}</div>

                <div class="flex items-center gap-3 my-1">
                    <button onclick="speak('${item.word}', 0.9)" class="btn-duo btn-blue rounded-2xl py-2 px-4 flex items-center gap-1.5 font-bold text-sm">
                        <span>正常語速</span>
                    </button>
                    <button onclick="speak('${item.word}', 0.6)" class="btn-duo btn-white rounded-2xl py-2 px-3 flex items-center gap-1.5 font-bold text-gray-600 text-sm">
                        <span>🐢 慢速 0.6x</span>
                    </button>
                </div>

                <div class="w-full flex flex-col gap-2.5 text-left mt-2">
                    <div class="bg-gray-50 border border-gray-200 rounded-2xl p-3 flex flex-col gap-1">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-black text-blue-600 uppercase">例句 ①</span>
                            <button onclick="speak('${item.sentence1.replace(/'/g, "\\'")}', 0.85)" class="text-blue-500 hover:text-blue-700 p-1">
                                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                            </button>
                        </div>
                        <p class="text-sm font-bold text-gray-800 leading-snug">${highlightWordInSentence(item.sentence1, item.word)}</p>
                        <p class="text-xs text-gray-500 font-semibold">${item.sentence1Zh}</p>
                    </div>

                    <div class="bg-gray-50 border border-gray-200 rounded-2xl p-3 flex flex-col gap-1">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-black text-indigo-600 uppercase">例句 ②</span>
                            <button onclick="speak('${item.sentence2.replace(/'/g, "\\'")}', 0.85)" class="text-blue-500 hover:text-blue-700 p-1">
                                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                            </button>
                        </div>
                        <p class="text-sm font-bold text-gray-800 leading-snug">${highlightWordInSentence(item.sentence2, item.word)}</p>
                        <p class="text-xs text-gray-500 font-semibold">${item.sentence2Zh}</p>
                    </div>
                </div>
            `;

            document.getElementById('vocab-modal').classList.remove('hidden');
        }

        function closeVocabModal() {
            sfx.pop();
            document.getElementById('vocab-modal').classList.add('hidden');
        }
    </script>

    <script>
        /* Final Completion Summary Screen */
        function renderSummaryScreen() {
            currentStage = 'summary';
            sfx.cheer();
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });

            document.getElementById('stage-badge').innerText = "🎉 全數通關！";
            document.getElementById('progress-indicator').innerText = "20 / 20 挑戰完成";
            document.getElementById('progress-bar-fill').style.width = '100%';

            resetFooter();
            document.getElementById('footer-section').classList.add('hidden');

            const card = document.getElementById('main-content-card');
            card.innerHTML = `
                <div class="max-w-xl mx-auto flex flex-col items-center text-center gap-6 py-4">
                    <div class="text-7xl">🎉</div>
                    <div>
                        <h2 class="text-3xl sm:text-4xl font-black text-gray-900 font-fredoka">恭喜通關！PET單字特訓-1 大成功</h2>
                        <p class="text-base text-gray-600 font-bold mt-1">你已成功完成 10 個核心單字的雙階段學習與 20 題混合題型挑戰！</p>
                    </div>

                    <!-- Stats overview -->
                    <div class="grid grid-cols-2 gap-4 w-full">
                        <div class="bg-amber-50 border-2 border-amber-200 rounded-3xl p-5 flex flex-col items-center">
                            <span class="text-xs font-black uppercase tracking-wider text-amber-600">總累積經驗</span>
                            <span class="text-3xl font-black text-amber-700 font-fredoka mt-1">${xp} XP</span>
                        </div>
                        <div class="bg-green-50 border-2 border-green-200 rounded-3xl p-5 flex flex-col items-center">
                            <span class="text-xs font-black uppercase tracking-wider text-green-600">剩餘愛心</span>
                            <span class="text-3xl font-black text-green-700 font-fredoka mt-1">${hearts} / 5</span>
                        </div>
                    </div>

                    <!-- 10 Vocabulary Review Cards -->
                    <div class="w-full bg-white border-2 border-gray-200 rounded-3xl p-5 text-left shadow-sm">
                        <h4 class="text-xs font-black uppercase text-gray-400 mb-3 tracking-wider">本單元 10 大核心單字總覽</h4>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                            ${VOCAB_DATA.map((v, i) => `
                                <div class="p-3 rounded-2xl bg-gray-50 border border-gray-200/80 flex items-center justify-between">
                                    <div class="flex flex-col">
                                        <div class="flex items-center gap-1.5">
                                            <span class="font-black text-base text-gray-800">${i + 1}. ${v.word}</span>
                                            <span class="text-xs text-blue-600 font-bold">${v.pos}</span>
                                        </div>
                                        <span class="text-xs text-gray-500 font-semibold">${v.def}</span>
                                    </div>
                                    <button onclick="speak('${v.word}', 0.9)" class="text-gray-400 hover:text-blue-500 p-1.5" title="朗讀">
                                        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <button id="play-again-btn" class="btn-duo btn-green rounded-2xl py-4 px-10 font-black text-lg tracking-wider uppercase w-full">
                        再次挑戰複習
                    </button>
                </div>
            `;

            document.getElementById('play-again-btn').onclick = () => {
                location.reload();
            };
        }

        /* Application Initialization and Flow Wiring */
        function initApp() {
            // Main Action Button Routing
            document.getElementById('main-action-btn').onclick = () => {
                sfx.init();

                if (currentStage === 'learn') {
                    if (learnWordIndex < VOCAB_DATA.length - 1) {
                        learnWordIndex++;
                        renderLearnWord(learnWordIndex);
                    } else {
                        renderTransitionScreen();
                    }
                } else if (currentStage === 'transition') {
                    challengeIndex = 0;
                    renderPracticeChallenge(challengeIndex);
                } else if (currentStage === 'practice') {
                    if (!hasChecked) {
                        checkCurrentPractice();
                    } else {
                        challengeIndex++;
                        if (challengeIndex < CHALLENGES_DATA.length) {
                            renderPracticeChallenge(challengeIndex);
                        } else {
                            renderSummaryScreen();
                        }
                    }
                }
            };

            // Vocabulary Modal Controls
            document.getElementById('view-card-btn').onclick = openVocabModal;
            document.getElementById('close-vocab-modal-btn').onclick = closeVocabModal;

            // Heart refill
            document.getElementById('refill-hearts-btn').onclick = () => {
                hearts = 5;
                document.getElementById('hearts-count').innerText = hearts;
                document.getElementById('energy-modal').classList.add('hidden');
            };

            // Start at first word in learning phase
            renderLearnWord(0);
        }

        window.onload = initApp;
    </script>
